# ~/.tmux.conf
# ZazenCodes-inspired: catppuccin top status bar + useful tmux defaults

# Prefix closer to Alex/ZazenCodes setup. Press Ctrl-a instead of Ctrl-b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Basics
set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename off

# Extended keys on for using pi TUI inside tmux
set -g extended-keys on
set -g extended-keys-format csi-u

# Vim-like pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind - break-pane -t :

# Create panes/windows in current directory
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Catppuccin, matching ZazenCodes dotfiles
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(🔎),}"
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'

# Load catppuccin manually, as in his repo
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right ""
set -g status-left '#{E:@catppuccin_status_session} '
# Show full current path clearly on the tmux bar.
set -g status-right '#[bg=#45475a,fg=#ffffff,bold]  #{pane_current_path}  '

# True colour
set -g default-terminal 'tmux-256color'
set -ag terminal-features ',xterm-256color:RGB'

# TPM last
run '~/.tmux/plugins/tpm/tpm'
